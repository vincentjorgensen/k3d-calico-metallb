---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    name: httpbin
    istio.io/dataplane-mode: ambient
  name: httpbin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: httpbin
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  labels:
    app: httpbin
  namespace: httpbin
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: LoadBalancer
  selector:
    app: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: httpbin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin
      containers:
      - image: docker.io/mccutchen/go-httpbin:latest
        imagePullPolicy: IfNotPresent
        name: httpbin
        command: [ go-httpbin ]
        args:
        - "-port"
        - "8080"
        - "-max-duration"
        - "600s" # override default 10s
        ports:
        - containerPort: 8080
